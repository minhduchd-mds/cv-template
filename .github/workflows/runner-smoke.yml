name: Runner Smoke Test

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner
        run: |
          echo "runner-ok"
          uname -a
