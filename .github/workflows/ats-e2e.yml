name: ATS E2E

on:
  push:
    branches: [master]
    paths:
      - 'public/studio/ats.js'
      - 'public/studio/ats.css'
      - 'public/studio/index.html'
      - 'tests/e2e/ats.spec.js'
      - '.github/workflows/ats-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ats-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ATS end-to-end tests
        run: npx playwright test tests/e2e/ats.spec.js --project=desktop-chromium

      - name: Upload ATS test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ats-e2e-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
