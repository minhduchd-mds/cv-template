name: Deploy Vite to GitHub Pages

# Build and publish the Vite application on master. Manual dispatch remains
# available for recovery/redeploys.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: vite-pages
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for branch-source Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting until no branch-source Pages workflow on master can overwrite the Vite deployment..."
          quiet_checks=0

          for attempt in $(seq 1 30); do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs?branch=master&per_page=50")

            pages_pending=$(echo "$response" | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')

            if [ "$pages_pending" -eq 0 ]; then
              quiet_checks=$((quiet_checks + 1))
              echo "Attempt ${attempt}/30: no active branch-source Pages deployment (${quiet_checks}/2 confirmations)."
              if [ "$quiet_checks" -ge 2 ]; then
                echo "Branch-source Pages is quiet. Publishing Vite dist last."
                exit 0
              fi
            else
              quiet_checks=0
              echo "Attempt ${attempt}/30: ${pages_pending} branch-source Pages deployment(s) still active."
            fi

            sleep 5
          done

          echo "::warning::Branch-source Pages remained active for the full guard window. Continuing so the workflow cannot hang indefinitely."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: vite-pages
