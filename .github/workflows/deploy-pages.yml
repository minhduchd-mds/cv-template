name: Deploy Vite to GitHub Pages

# Build and publish the Vite app on every master push. The static branch-source
# fallback remains available as a resilience path when hosted runners are unavailable.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install and build with diagnostics
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            npm run build 2>&1 | tee -a build-output.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-diagnostics
          path: build-output.log
          if-no-files-found: warn
          retention-days: 3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: vite-pages
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for branch-source Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting until no branch-source Pages workflow on master can overwrite the Vite deployment..."
          quiet_checks=0

          for attempt in $(seq 1 30); do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs?branch=master&per_page=50")

            pages_pending=$(echo "$response" | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')

            if [ "$pages_pending" -eq 0 ]; then
              quiet_checks=$((quiet_checks + 1))
              echo "Attempt ${attempt}/30: no active branch-source Pages deployment (${quiet_checks}/2 confirmations)."
              if [ "$quiet_checks" -ge 2 ]; then
                echo "Branch-source Pages is quiet. Publishing Vite dist last."
                exit 0
              fi
            else
              quiet_checks=0
              echo "Attempt ${attempt}/30: ${pages_pending} branch-source Pages deployment(s) still active."
            fi

            sleep 5
          done

          echo "::warning::Branch-source Pages remained active for the full guard window. Continuing so the workflow cannot hang indefinitely."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: vite-pages
