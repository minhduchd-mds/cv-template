name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: vite-pages
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for GitHub's legacy Pages workflow so the Vite deployment is always published last..."
          for attempt in $(seq 1 30); do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs?head_sha=${GH_SHA}&per_page=20")

            legacy_count=$(echo "$response" | jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | length')
            legacy_pending=$(echo "$response" | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')

            if [ "$legacy_count" -gt 0 ] && [ "$legacy_pending" -eq 0 ]; then
              echo "Legacy Pages workflow completed. Publishing Vite dist now."
              exit 0
            fi

            echo "Attempt ${attempt}/30: legacy workflow not finished yet."
            sleep 5
          done

          echo "::warning::Legacy Pages workflow was not observed as completed within 150 seconds. Continuing with Vite deployment."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: vite-pages
