name: Deploy Vite to GitHub Pages

# Hosted Actions runners are currently unavailable for this repository.
# Keep Vite deployment available on demand while the static branch-source fallback
# remains the resilient delivery path.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install and build with diagnostics
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee build-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            npm run build 2>&1 | tee -a build-output.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vite-build-diagnostics
          path: build-output.log
          if-no-files-found: warn
          retention-days: 3


      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: vite-pages
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for branch-source Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting until no branch-source Pages workflow on master can overwrite the Vite deployment..."
          quiet_checks=0

          for attempt in $(seq 1 30); do
            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs?branch=master&per_page=50")

            pages_pending=$(echo "$response" | jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')

            if [ "$pages_pending" -eq 0 ]; then
              quiet_checks=$((quiet_checks + 1))
              echo "Attempt ${attempt}/30: no active branch-source Pages deployment (${quiet_checks}/2 confirmations)."
              if [ "$quiet_checks" -ge 2 ]; then
                echo "Branch-source Pages is quiet. Publishing Vite dist last."
                exit 0
              fi
            else
              quiet_checks=0
              echo "Attempt ${attempt}/30: ${pages_pending} branch-source Pages deployment(s) still active."
            fi

            sleep 5
          done

          echo "::warning::Branch-source Pages remained active for the full guard window. Continuing so the workflow cannot hang indefinitely."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: vite-pages
