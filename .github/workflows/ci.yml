name: CV Studio CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cv-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Security lint, layout contracts and build
        id: build
        run: |
          npm run layout:check
          npm run security:lint
          npm run build

      # Later gates run even when an earlier one fails so each run reports every regression.
      - name: Enforce bundle budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run verify:bundle

      - name: Install Chromium for browser QA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Install PDF text audit tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run responsive end-to-end tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e:ci

      - name: Enforce Lighthouse quality budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cv-studio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4173/ > /dev/null
          export CHROME_PATH="$(node -e "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())")"

          npx lighthouse http://127.0.0.1:4173/ \
            --quiet \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-report.json

          npm run lighthouse:assert

      - name: Upload visual QA and Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-studio-quality-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            lighthouse-report.json
          if-no-files-found: warn
          retention-days: 14
