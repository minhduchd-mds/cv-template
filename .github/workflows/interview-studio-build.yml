name: Interview Studio Build Check

# Manual fallback while hosted runners are unreliable. The job intentionally
# reuses the same deterministic quality gate as the primary CI workflow so
# Interview Studio cannot drift onto a different build path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interview-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Interview Studio quality gate
        run: npm run verify
