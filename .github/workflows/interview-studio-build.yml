name: Interview Studio Build Check

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: interview-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Build without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            local payload
            payload=$(jq -nc               --arg state "$state"               --arg context "interview-studio/build"               --arg description "$description"               --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"               '{state:$state,context:$context,description:$description,target_url:$target_url}')
            curl -fsSL -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"               -d "$payload" >/dev/null
          }

          post_status pending "runner started"

          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch --depth=1 origin "${GITHUB_SHA}" > /tmp/checkout.log 2>&1; then
            post_status failure "checkout failed"
            cat /tmp/checkout.log
            exit 1
          fi
          git checkout --detach FETCH_HEAD
          post_status pending "checkout passed"

          node --version
          npm --version

          set +e
          npm ci --no-audit --no-fund > /tmp/build.log 2>&1
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            detail=$(tail -n 1 /tmp/build.log | tr '\n' ' ' | cut -c1-120)
            post_status failure "npm ci: ${detail:-failed}"
            cat /tmp/build.log
            exit "$install_status"
          fi
          post_status pending "npm ci passed"

          npm run build >> /tmp/build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            detail=$(tail -n 1 /tmp/build.log | tr '\n' ' ' | cut -c1-120)
            post_status failure "vite: ${detail:-build failed}"
            cat /tmp/build.log
            exit "$build_status"
          fi

          cat /tmp/build.log
          post_status success "Vite production build passed"
