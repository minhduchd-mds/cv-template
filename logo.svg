<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">CV Studio logo</title>
  <desc id="desc">Rounded dark app icon with a blue-to-violet CV monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="accent" x1="15" y1="16" x2="51" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AC8FA"/>
      <stop offset="0.5" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M31 19H26.5C19.6 19 14 24.6 14 31.5S19.6 44 26.5 44H31" fill="none" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M32 20.5 39.2 43 50 20.5" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49.5" cy="15" r="2.5" fill="#5AC8FA"/>
</svg>
