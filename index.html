    <script>
      // If the built Vue entry fails to load or mount, fall back to the
      // self-contained static apps that Vite copies from public/ into dist/.
      // src/main.js clears the timer right after mount, so slow networks are
      // never redirected once the real app starts.
      (function () {
        var redirected = false
        function fallbackIfEmpty() {
          var app = document.getElementById('app')
          if (redirected || !app || app.childElementCount !== 0) return
          redirected = true
          var hash = window.location.hash
          var target = hash === '#studio'
            ? './studio/?v=20261004-safe-dom-v1'
            : './directions/'
          window.location.replace(target)
        }
        // Only same-origin script failures count; extension or image errors must
        // not redirect a page that is still downloading.
        function onBootError(event) {
          if (!window.__cvStudioFallbackTimer) return
          var target = event.target
          var origin = window.location.origin
          var isScriptLoadError = target && target.tagName === 'SCRIPT' &&
            String(target.src).indexOf(origin) === 0
          var isOwnScriptError = typeof event.filename === 'string' &&
            event.filename.indexOf(origin) === 0
          if (!isScriptLoadError && !isOwnScriptError) return
          window.setTimeout(fallbackIfEmpty, 300)
        }
        window.addEventListener('error', onBootError, true)
        window.__cvStudioFallbackTimer = window.setTimeout(fallbackIfEmpty, 6000)
      })()
    </script>
