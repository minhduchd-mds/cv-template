<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CV Studio — Portfolio & Resume System</title>
  <desc id="desc">Social preview card for CV Studio, a local-first portfolio and resume builder.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1060" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFBFD"/>
      <stop offset="1" stop-color="#EFF2F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(950 90) rotate(135) scale(420 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071E3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="70" y1="64" x2="198" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="accent" x1="95" y1="98" x2="180" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AC8FA"/>
      <stop offset="0.5" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="44" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="70" width="138" height="138" rx="38" fill="url(#iconBg)"/>
    <path d="M138 103h-11c-18 0-32 14-32 32s14 32 32 32h11" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>
    <path d="m139 108 18 56 27-56" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="74" y="285" fill="#1D1D1F" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1">CV STUDIO</text>
  <text x="72" y="365" fill="#1D1D1F" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">One profile.</text>
  <text x="72" y="438" fill="#0071E3" font-family="Georgia, Times New Roman, serif" font-size="66" font-style="italic">Multiple directions.</text>
  <text x="74" y="500" fill="#6E6E73" font-family="Inter, Arial, sans-serif" font-size="24">Local-first portfolio &amp; resume system · A4-ready · Open source</text>
  <g transform="translate(806 255)">
    <rect width="300" height="230" rx="28" fill="#FFFFFF" stroke="#DDE3EC"/>
    <rect x="24" y="24" width="84" height="182" rx="16" fill="#111827"/>
    <rect x="128" y="30" width="112" height="12" rx="6" fill="#1D1D1F"/>
    <rect x="128" y="62" width="138" height="8" rx="4" fill="#CBD2DC"/>
    <rect x="128" y="82" width="116" height="8" rx="4" fill="#D6DCE5"/>
    <rect x="128" y="122" width="52" height="38" rx="10" fill="#0071E31A"/>
    <rect x="188" y="122" width="52" height="38" rx="10" fill="#8B5CF61A"/>
    <rect x="128" y="178" width="138" height="7" rx="3.5" fill="#D6DCE5"/>
    <rect x="128" y="195" width="100" height="7" rx="3.5" fill="#E0E5EC"/>
  </g>
</svg>
